<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Drift — Vivarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03242b; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import {
  Vivarium, TAU, clamp, lerp, smoothstep, makeNoise2D, fbm,
  mulberry32, hexToRgb, mixHex, rgba,
} from '../_runtime/engine.js';
const V = await Vivarium.ready;
const view = V.canvas('stage'), ctx = view.ctx;
/* params */
const DEFAULTS = { fish: 34, rays: 0.6, bubbles: 24, coral: 0.7, caustics: 0.5 };
let P = Object.assign({}, DEFAULTS, V.params);
V.on('params', (p) => {
  const prev = P; P = Object.assign({}, P, p);
  if (prev.fish !== P.fish) buildFish();
  if (prev.bubbles !== P.bubbles) buildBubbles();
  if (prev.coral !== P.coral) coralCache.clear();
});
const reefNoise = makeNoise2D(9101), moteNoise = makeNoise2D(4409);
let W = 0, H = 0, floorY = 0, backdrop = null;
let causticSprites = [], beams = [], fish = [], bubbles = [], motes = [], jellies = [];
const coralCache = new Map();
const C = { deep: '#03242b', mid: '#0a4a52', reef: '#117d78', bright: '#3fc0a0', pale: '#d4fff0' };
/* sprites */
function makeGlow(color) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), rgb = hexToRgb(color); c.width = 64; c.height = 64;
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',1)');
  gr.addColorStop(0.3, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.42)');
  gr.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
}
const glowPale = makeGlow(C.pale);
function makeBubbleSprite() {
  const c = document.createElement('canvas'); c.width = 32; c.height = 32;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 2, 16, 16, 15);
  gr.addColorStop(0, 'rgba(212,255,240,0.06)'); gr.addColorStop(0.72, 'rgba(212,255,240,0.10)');
  gr.addColorStop(1, 'rgba(212,255,240,0.02)');
  g.fillStyle = gr; g.beginPath(); g.arc(16, 16, 15, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(212,255,240,0.72)'; g.lineWidth = 1.4;
  g.beginPath(); g.arc(16, 16, 13.5, 0, TAU); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(16, 16, 12, Math.PI * 1.08, Math.PI * 1.48); g.stroke();
  return c;
}
const bubbleSprite = makeBubbleSprite();
function makeCausticSprite(seed) {
  const size = 128, c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d'), n = makeNoise2D(seed), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

    const v1 = 1 - Math.abs(fbm(n, nx * 3.2, ny * 3.2, 3));
    const v2 = 1 - Math.abs(fbm(n, nx * 6.4 + 9.1, ny * 6.4 - 3.7, 2));

    const v = (Math.pow(v1, 7) * 0.85 + Math.pow(v2, 9) * 0.45) * mask * mask;
    const i = (y * size + x) * 4;

/* backdrop */
function buildBackdrop() {
  backdrop = document.createElement('canvas'); backdrop.width = W; backdrop.height = H;
  const g = backdrop.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#041e26'); sky.addColorStop(0.38, C.deep);
  sky.addColorStop(0.7, '#074049'); sky.addColorStop(1, '#042b33');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const surface = g.createLinearGradient(0, 0, 0, H * 0.35);
  surface.addColorStop(0, 'rgba(212,255,240,0.16)'); surface.addColorStop(1, 'rgba(212,255,240,0)');
  g.fillStyle = surface; g.fillRect(0, 0, W, H * 0.35);
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) {
    const n = fbm(reefNoise, x * 0.0021, 4.2, 3);
    g.lineTo(x, floorY - H * 0.05 - n * H * 0.055 - H * 0.012);
  }
  g.lineTo(W, H); g.closePath(); g.fillStyle = '#06363d'; g.fill();
  g.globalAlpha = 0.35; g.strokeStyle = C.reef; g.lineWidth = 1.2; g.stroke(); g.globalAlpha = 1;
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) {
    const n = fbm(reefNoise, x * 0.0014 + 7.3, 1.7, 3);
    g.lineTo(x, floorY + n * H * 0.018);
  }
  g.lineTo(W, H); g.closePath(); g.fillStyle = '#0a3a3d'; g.fill();
  g.save(); g.clip();

  sand.addColorStop(0, '#0d4849'); sand.addColorStop(0.55, '#093b3f'); sand.addColorStop(1, '#062c32');
  g.fillStyle = sand; g.fillRect(0, floorY - 20, W, H - floorY + 20);
  const r = mulberry32(3031);
  g.lineWidth = 1;
  for (let i = 0; i < 22; i++) {
    const yy = floorY + 6 + (i / 22) * (H - floorY);
    g.beginPath();
    for (let x = 0; x <= W + 8; x += 8) {
      const wob = reefNoise(x * 0.003 + i * 0.7, yy * 0.01) * 3.2;
      if (x === 0) g.moveTo(x, yy + wob); else g.lineTo(x, yy + wob);
    }
    g.strokeStyle = 'rgba(63,192,160,' + (0.035 + i * 0.003) + ')'; g.stroke();
  }
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = floorY + 8 + r() * (H - floorY - 10), rr = 1 + r() * 4;
    g.fillStyle = 'rgba(3,30,34,' + (0.18 + r() * 0.3) + ')';
    g.beginPath(); g.ellipse(x, y, rr, rr * 0.55, 0, 0, TAU); g.fill();
  }
  for (let i = 0; i < 3; i++) {
    const x = W * (0.16 + r() * 0.7), y = floorY + 18 + r() * (H - floorY - 36), rad = 7 + r() * 8;
    g.save(); g.translate(x, y); g.rotate(r() * TAU); g.fillStyle = 'rgba(17,125,120,0.75)';
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * TAU - Math.PI / 2, rr = k % 2 ? rad * 0.42 : rad;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.7;

    }
    g.closePath(); g.fill(); g.restore();
  }
  g.restore();
}
/* life */
function buildFish() {
  const n = Math.round(clamp(P.fish, 0, 80) * (V.reduced ? 0.5 : 1)), r = mulberry32(8801 + n * 17);
  fish = [];
  for (let i = 0; i < n; i++) {
    const z = 0.55 + r() * 0.75;
    fish.push({
      x: W * (0.15 + r() * 0.7), y: H * (0.1 + r() * 0.65),
      vx: (r() - 0.5) * 40, vy: (r() - 0.5) * 24, z: z,
      size: 4.5 + r() * 6, tone: r(), ph: r() * TAU,
    });
  }
}
function buildBubbles() {
  const n = Math.round(clamp(P.bubbles, 0, 60) * (V.reduced ? 0.5 : 1)), r = mulberry32(4201 + n * 31);
  bubbles = [];
  for (let i = 0; i < n; i++) bubbles.push({
    x: r() * W, y: r() * H, size: 2 + r() * 6, sp: 16 + r() * 34, ph: r() * TAU, wob: 6 + r() * 14,
  });
}
function buildMotes() {
  const n = Math.round(clamp((W * H) / 21000, 40, 150) * (V.reduced ? 0.55 : 1)), r = mulberry32(6203);
  motes = [];
  for (let i = 0; i < n; i++) motes.push({
    x: r() * W, y: r() * H * 0.92, size: 0.8 + r() * 2.2, ph: r() * TAU, sp: 0.25 + r() * 0.6, depth: 0.3 + r() * 0.7,
  });
}
function buildJellies() {
  const r = mulberry32(7701); jellies = [];
  for (let i = 0; i < 4; i++) jellies.push({
    x: W * (0.1 + r() * 0.8), y: H * (0.15 + r() * 0.65), r: 15 + r() * 20, ph: r() * TAU, sp: 5 + r() * 7, tone: r(),
  });
}
function buildBeams() {
  const r = mulberry32(6161); beams = [];
  for (let i = 0; i < 6; i++) beams.push({
    x: (i + 0.2 + r() * 0.6) / 6 * W, w: 26 + r() * 88, lean: (r() - 0.5) * 0.55, ph: r() * TAU, spd: 0.07 + r() * 0.09,
  });
}
function buildCaustics() {
  causticSprites = []; const r = mulberry32(5151);
  const imgs = [makeCausticSprite(900), makeCausticSprite(937), makeCausticSprite(974)];
  for (let i = 0; i < 12; i++) causticSprites.push({
    img: imgs[i % 3], x: r() * W, y: floorY + r() * (H - floorY + 40),
    size: 170 + r() * 300, ph: r() * TAU, spd: 0.5 + r() * 0.8,
  });
}
/* coral */
function coralFor(ic) {
  let shape = coralCache.get(ic.id);

  const count = 4 + Math.floor(r() * 4);

    fronds.push({
      a: -Math.PI / 2 + spread + (r() - 0.5) * 0.3, len: 0.45 + r() * 0.65,
      bend: (r() - 0.5) * 0.9, w: 2.2 + r() * 3.4, tone: r(), ph: r() * TAU,

  shape = { fronds: fronds, tone: r(), weed: 1 + Math.floor(r() * 3), ph: r() * TAU };

function drawCorals(t) {

    halo.addColorStop(0.7, 'rgba(2,16,20,' + 0.14 * fade + ')');
    halo.addColorStop(1, 'rgba(2,16,20,0)');

      sh.addColorStop(0, 'rgba(2,20,22,' + 0.30 * fade + ')'); sh.addColorStop(1, 'rgba(2,20,22,0)');

/* ambient */
function drawBeams(t) {
  if (P.rays <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < beams.length; i++) {
    const b = beams[i], xTop = b.x + Math.sin(t * b.spd + b.ph) * 22, xBot = xTop + b.lean * H * 0.8;
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.88);

    ctx.moveTo(xTop - b.w * 0.5, -20); ctx.lineTo(xTop + b.w * 0.5, -20);

}
function drawCaustics(t) {
  if (P.caustics <= 0.01) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, floorY - 40, W, H - floorY + 40); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < causticSprites.length; i++) {

}
function drawMotes(t, dt) {
  if (!motes.length) return;

  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    const nx = moteNoise(m.x * 0.002, m.y * 0.002 + t * 0.05);

function drawJellies(t, dt) {
  for (let i = 0; i < jellies.length; i++) {

    if (j.y < -70) { j.y = H + 50; j.x = (j.x + W * 0.37) % W; }

function drawFish(t, dt) {

    ctx.beginPath(); ctx.moveTo(-s * 0.82, 0);
    ctx.lineTo(-s * 1.55, -s * (0.48 - wag * 0.5)); ctx.lineTo(-s * 1.55, s * (0.48 + wag * 0.5));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha *= 0.6; ctx.fillStyle = C.pale;
    ctx.beginPath(); ctx.moveTo(s * 0.55, 0); ctx.quadraticCurveTo(0, -s * 0.18, -s * 0.7, 0);
    ctx.quadraticCurveTo(0, -s * 0.04, s * 0.55, 0); ctx.fill();
    ctx.globalAlpha = 0.75; ctx.fillStyle = '#03242b';
    ctx.beginPath(); ctx.arc(s * 0.55, -s * 0.08, Math.max(0.7, s * 0.09), 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawBubbles(t, dt) {
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    b.y -= b.sp * dt * (V.reduced ? 0.7 : 1); b.x += Math.sin(t * 1.4 + b.ph) * b.wob * dt;
    if (b.y < -12) { b.y = H + 10; b.x = (b.x + W * 0.29) % W; }
    const s = b.size * 2.6;
    ctx.globalAlpha = 0.5; ctx.drawImage(bubbleSprite, b.x - s / 2, b.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
/* layout + frame */
function rebuild() {
  W = view.w; H = view.h; floorY = H * 0.82;
  buildBackdrop(); buildBeams(); buildCaustics();
  buildFish(); buildBubbles(); buildMotes(); buildJellies(); coralCache.clear();
}
view.onResize(rebuild); rebuild();
V.loop((dt, t) => {
  if (backdrop) ctx.drawImage(backdrop, 0, 0, W, H);
  else V.bg(ctx, W, H, ['#041e26', C.deep, C.mid]);
  drawBeams(t); drawCaustics(t); drawCorals(t); drawMotes(t, dt);
  drawJellies(t, dt); drawFish(t, dt); drawBubbles(t, dt);
  const fog = ctx.createLinearGradient(0, 0, 0, H);
  fog.addColorStop(0, 'rgba(2,18,24,0.20)'); fog.addColorStop(0.5, 'rgba(10,74,82,0.05)');
  fog.addColorStop(0.82, 'rgba(10,74,82,0.08)'); fog.addColorStop(1, 'rgba(2,18,24,0.36)');
  ctx.fillStyle = fog; ctx.fillRect(0, 0, W, H);
  V.vignette(ctx, W, H, 0.5); V.grain(ctx, W, H, 0.05);
});
