<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image — Vivarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import { Vivarium, TAU, clamp, smoothstep } from '../_runtime/engine.js';

const V = await Vivarium.ready;
const view = V.canvas('stage');
const ctx = view.ctx;

const DEFAULTS = { zoom: 1.18, drift: 0.6, motion: 1, dim: 0.1, grain: 0.18, vignette: 0.4 };
let P = Object.assign({}, DEFAULTS, V.params);
V.on('params', (p) => {
  P = Object.assign({}, P, p);
});

/* ------------------------------------------------------------------ */
/* Image loading                                                      */
/* ------------------------------------------------------------------ */
let picture = null;
let source = '';
let loaded = false;
let failed = false;
let fade = 0;

function setImage(url) {
  if (!url) {
    source = '';
    loaded = false;
    failed = false;
    fade = 0;
    picture = null;
    return;
  }
  if (url === source) return;
  source = url;
  loaded = false;
  failed = false;
  fade = 0;
  const img = new Image();
  img.decoding = 'async';
  img.onload = function () {
    if (url !== source) return;
    picture = img;
    loaded = true;
    failed = false;
  };
  img.onerror = function () {
    if (url !== source) return;
    picture = null;
    loaded = false;
    failed = true;
  };
  img.src = url;
}

const initial = V.media && V.media.image;
if (initial) setImage(initial);

V.on('media', function (media) {
  setImage(media && media.image ? media.image : '');
});

/* ------------------------------------------------------------------ */
/* Placeholder                                                        */
/* ------------------------------------------------------------------ */
function drawPlaceholder(t) {
  const w = view.w;
  const h = view.h;
  V.bg(ctx, w, h, ['#0d0b09', '#14100c', '#0a0908']);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const warm = ctx.createRadialGradient(w * 0.7, h * 0.22, 0, w * 0.7, h * 0.22, Math.min(w, h) * 0.7);
  warm.addColorStop(0, 'rgba(168,132,84,0.12)');
  warm.addColorStop(0.5, 'rgba(120,96,64,0.05)');
  warm.addColorStop(1, 'rgba(120,96,64,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0, 0, w, h);

  const cool = ctx.createRadialGradient(w * 0.2, h * 0.85, 0, w * 0.2, h * 0.85, Math.min(w, h) * 0.55);
  cool.addColorStop(0, 'rgba(70,96,120,0.10)');
  cool.addColorStop(1, 'rgba(70,96,120,0)');
  ctx.fillStyle = cool;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  /* slow light sweep */
  const sweep = ((t * 0.028) % 1) * 1.6 - 0.3;
  const sx = w * sweep;
  const beam = ctx.createLinearGradient(sx - w * 0.22, 0, sx + w * 0.22, h);
  beam.addColorStop(0, 'rgba(255,240,220,0)');
  beam.addColorStop(0.5, 'rgba(255,232,200,0.03)');
  beam.addColorStop(1, 'rgba(255,240,220,0)');
  ctx.fillStyle = beam;
  ctx.fillRect(0, 0, w, h);

  const scale = clamp(Math.min(w, h) / 900, 0.7, 1.6);
  const cx = w / 2;
  const cy = h / 2;

  /* picture frame glyph */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = 0.30;
  ctx.strokeStyle = '#ecdcc2';
  ctx.lineWidth = 1.6 * scale;
  const fw = 62 * scale;
  const fh = 48 * scale;
  ctx.beginPath();
  ctx.rect(-fw / 2, -fh / 2, fw, fh);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-fw / 2 + 5 * scale, fh / 2 - 5 * scale);
  ctx.lineTo(-fw / 2 + 22 * scale, fh / 2 - 22 * scale);
  ctx.lineTo(-fw / 2 + 34 * scale, fh / 2 - 12 * scale);
  ctx.lineTo(-fw / 2 + 44 * scale, fh / 2 - 20 * scale);
  ctx.lineTo(fw / 2 - 5 * scale, fh / 2 - 5 * scale);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(fw / 2 - 16 * scale, -fh / 2 + 14 * scale, 4.2 * scale, 0, TAU);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f0e3cd';
  ctx.font = '600 ' + Math.round(15 * scale) + 'px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('No image selected', cx, cy + 74 * scale);
  ctx.globalAlpha = 0.26;
  ctx.font = '400 ' + Math.round(12.5 * scale) + 'px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('Open Vivarium → Media → Choose image', cx, cy + 96 * scale);
  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* Frame                                                              */
/* ------------------------------------------------------------------ */
function drawPicture(t, dt) {
  const w = view.w;
  const h = view.h;
  const iw = picture.naturalWidth || picture.width;
  const ih = picture.naturalHeight || picture.height;
  if (!iw || !ih) return;

  /* Cover the screen, then add headroom for the Ken Burns move. */
  const cover = Math.max(w / iw, h / ih);
  const zoom = clamp(Number(P.zoom) || 1, 1, 2);
  const scale = cover * zoom;
  const sw = iw * scale;
  const sh = ih * scale;

  const maxX = Math.max(0, (sw - w) / 2);
  const maxY = Math.max(0, (sh - h) / 2);
  const drift = clamp(Number(P.drift) || 0, 0, 1);
  const speed = clamp(Number(P.motion) || 0, 0, 2);

  const phase = (V.monitor.index || 0) * 1.7;
  const ox = Math.sin(t * 0.028 * speed + phase) * maxX * drift;
  const oy = Math.cos(t * 0.019 * speed + phase * 1.3) * maxY * drift;

  const dx = (w - sw) / 2 + ox;
  const dy = (h - sh) / 2 + oy;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  if (fade < 1) {
    fade = Math.min(1, fade + dt / 1.1);
    ctx.globalAlpha = smoothstep(0, 1, fade);
  }
  try {
    ctx.drawImage(picture, dx, dy, sw, sh);
  } catch (e) {
    /* not decodable yet */
  }
  ctx.restore();

  if (P.dim > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + clamp(P.dim, 0, 0.85) + ')';
    ctx.fillRect(0, 0, w, h);
  }
}

V.loop((dt, t) => {
  if (loaded && picture) {
    drawPicture(t, dt);
  } else {
    drawPlaceholder(t);
  }
  if (P.vignette > 0) V.vignette(ctx, view.w, view.h, clamp(P.vignette, 0, 1) * 0.8);
  if (P.grain > 0) V.grain(ctx, view.w, view.h, clamp(P.grain, 0, 1) * 0.09);
});
</script>
</body>
</html>
