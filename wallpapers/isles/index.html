<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isles — Vivarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a24; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import {
  Vivarium, TAU, clamp, smoothstep, makeNoise2D, fbm,
  mulberry32, hexToRgb, mixHex, rgba,
} from '../_runtime/engine.js';

const V = await Vivarium.ready;
const view = V.canvas('stage'), ctx = view.ctx;

/* params */
const DEFAULTS = { mist: 0.5, trees: 0.6, birds: true, sky: 'auto', ripples: 1 };
let P = Object.assign({}, DEFAULTS, V.params);
V.on('params', (p) => {
  const prev = P; P = Object.assign({}, P, p);
  if (prev.trees !== P.trees) islandCache.clear();
});

const ridgeNoise = makeNoise2D(1501), mistNoise = makeNoise2D(2707), shoreNoise = makeNoise2D(3907);
let W = 0, H = 0, horizon = 0, mountains = null, mirror = null, mistTile = null, stars = [];
const islandCache = new Map();
let flock = { active: false, next: 9, t0: 0, dir: 1, y: 0, seed: 0 };

const SKY = {
  night: ['#0b1a24', '#102a35', '#24404d'],
  dusk: ['#1b2433', '#4a5a5e', '#c3ae8e'],
  day: ['#5f8a8a', '#a8c6a0', '#e8e2c8'],
};
const RIDGES = [
  { seed: 1201, amp: 0.165, min: 0.012, freq: 1.15, off: 0.0, color: '#41616a', snow: 0.62 },
  { seed: 2407, amp: 0.130, min: 0.010, freq: 1.75, off: 11.3, color: '#2c4a56', snow: 0.70 },
  { seed: 3607, amp: 0.100, min: 0.008, freq: 2.45, off: 23.7, color: '#1d3642', snow: 0.78 },
];

function toHex(r, g, b) {
  const n = ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)) >>> 0;
  return '#' + n.toString(16).slice(1);
}
function blend3(cols, w) {
  const t = (w.night + w.dusk + w.day) || 1, a = hexToRgb(cols[0]), b = hexToRgb(cols[1]), c = hexToRgb(cols[2]);
  return toHex((a.r * w.night + b.r * w.dusk + c.r * w.day) / t,
    (a.g * w.night + b.g * w.dusk + c.g * w.day) / t, (a.b * w.night + b.b * w.dusk + c.b * w.day) / t);
}
function skyWeights() {
  const h = V.time.dayFrac * 24, sr = V.time.sunrise, ss = V.time.sunset;
  if (P.sky === 'day') return { day: 1, dusk: 0, night: 0 };
  if (P.sky === 'night') return { day: 0, dusk: 0, night: 1 };
  if (P.sky === 'dusk') return { day: 0.06, dusk: 0.86, night: 0.22 };
  const day = smoothstep(sr - 0.6, sr + 1.0, h) * (1 - smoothstep(ss - 1.0, ss + 0.6, h));
  const duskRaw = clamp(1 - Math.abs(h - sr) / 1.8, 0, 1) + clamp(1 - Math.abs(h - ss) / 1.8, 0, 1);
  const dusk = clamp(duskRaw, 0, 1) * (1 - day * 0.5);
  return { day: day, dusk: dusk, night: clamp(1 - day - dusk, 0, 1) };
}

/* terrain */
function ridgeY(x, L) {
  const n = fbm(ridgeNoise, x * 0.00125 * L.freq + L.off, L.seed * 0.013, 4);
  return horizon + H * 0.016 - H * L.amp * (0.28 + (1 - Math.abs(n)) * 1.05) - H * L.min;
}
function buildMountains() {
  mountains = document.createElement('canvas'); mountains.width = W; mountains.height = H;
  const g = mountains.getContext('2d');
  for (let li = 0; li < RIDGES.length; li++) {
    const L = RIDGES[li], p = new Path2D();
    p.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) p.lineTo(x, ridgeY(x, L));
    p.lineTo(W, H); p.closePath();
    const grad = g.createLinearGradient(0, horizon - H * L.amp, 0, horizon + H * 0.03);
    grad.addColorStop(0, mixHex(L.color, '#a8c6a0', 0.14));
    grad.addColorStop(0.6, L.color); grad.addColorStop(1, mixHex(L.color, '#0b1a24', 0.45));
    g.fillStyle = grad; g.fill(p);

    g.save(); g.clip(p);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0);
    for (let x = W; x >= 0; x -= 10) {
      const base = horizon - H * L.amp * L.snow;
      const wob = ridgeNoise(x * 0.006 + li * 4.1, 2.7) * H * 0.016 + shoreNoise(x * 0.02, li) * H * 0.005;
      g.lineTo(x, base + wob);
    }
    g.closePath(); g.fillStyle = rgba('#e8e2c8', 0.88 - li * 0.16); g.fill();
    g.globalAlpha = 0.10; g.strokeStyle = L.color; g.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const x = (i / 26) * W + 8, y = horizon - H * L.amp * (0.6 + (i % 5) * 0.09);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + 8 + (i % 3) * 5, y + 10 + (i % 4) * 5); g.stroke();
    }
    g.globalAlpha = 1; g.restore();
  }

  mirror = document.createElement('canvas'); mirror.width = W; mirror.height = H;
  const mg = mirror.getContext('2d');
  mg.save(); mg.translate(0, horizon * 2); mg.scale(1, -1); mg.drawImage(mountains, 0, 0); mg.restore();
  const fade = mg.createLinearGradient(0, horizon, 0, H);
  fade.addColorStop(0, 'rgba(0,0,0,0.52)'); fade.addColorStop(0.35, 'rgba(0,0,0,0.30)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  mg.globalCompositeOperation = 'destination-in'; mg.fillStyle = fade; mg.fillRect(0, 0, W, H);
  mg.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 46; i++) {
    const y = horizon + 6 + Math.pow(i / 46, 1.3) * (H - horizon);
    mg.fillStyle = 'rgba(0,0,0,' + (0.10 + (i % 3) * 0.04) + ')'; mg.fillRect(0, y, W, 1.2);
  }
}
function makeMistTile() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 140;
  const g = c.getContext('2d'), r = mulberry32(8181);
  for (let i = 0; i < 24; i++) {
    const x = r() * 512, y = 34 + r() * 76, rad = 40 + r() * 86;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(232,226,200,0.19)'); gr.addColorStop(1, 'rgba(232,226,200,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }
  mistTile = c;
}
function buildStars() {
  const n = Math.round(((W * H) / 15000) * (V.reduced ? 0.6 : 1)), r = mulberry32(991); stars = [];
  for (let i = 0; i < n; i++) stars.push({
    x: r() * W, y: r() * horizon * 0.85, rad: 0.4 + r() * 1.2, ph: r() * TAU, sp: 0.5 + r() * 1.6,
  });
}

/* islets */
function islandFor(ic) {
  let s = islandCache.get(ic.id);
  if (s) return s;
  const r = mulberry32((ic.seed ^ 0x85ebca6b) >>> 0), pts = [], n = 14;
  for (let k = 0; k < n; k++) pts.push({ a: (k / n) * TAU, r: 0.78 + r() * 0.42 });
  const trees = [], tc = 2 + Math.floor(r() * 3);
  for (let k = 0; k < tc; k++) trees.push({ x: (r() - 0.5) * 0.9, h: 0.7 + r() * 0.8, ph: r() * TAU, tone: r() });
  s = { pts: pts, trees: trees, grass: 0.45 + r() * 0.25, tone: r() };
  islandCache.set(ic.id, s); return s;
}
function islandPath(x, y, w, h, shape) {
  const n = shape.pts.length;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const pt = shape.pts[k];
    const px = x + Math.cos(pt.a) * w * 0.5 * pt.r, py = y - h * 0.38 + Math.sin(pt.a) * h * 0.5 * pt.r;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawIsland(x, y, w, h, shape, fade, t, reflection) {
  const col = reflection ? '#10242c' : '#2a4640';
  islandPath(x, y, w, h, shape);
  if (reflection) { ctx.fillStyle = col; ctx.fill(); return; }
  const body = ctx.createLinearGradient(0, y - h, 0, y + h * 0.15);
  body.addColorStop(0, '#3f5c52'); body.addColorStop(0.45, col); body.addColorStop(1, '#16292f');
  ctx.fillStyle = body; ctx.fill();

  ctx.save(); ctx.clip();
  const grass = ctx.createRadialGradient(x, y - h * 0.52, 0, x, y - h * 0.52, w * 0.5);
  grass.addColorStop(0, rgba('#a8c6a0', 0.55 * shape.grass)); grass.addColorStop(0.6, rgba('#5f8a8a', 0.30));
  grass.addColorStop(1, 'rgba(36,64,77,0)');
  ctx.fillStyle = grass; ctx.fillRect(x - w * 0.6, y - h * 1.1, w * 1.2, h * 1.2); ctx.restore();

  ctx.strokeStyle = rgba('#e8e2c8', 0.16); ctx.lineWidth = 1;
  islandPath(x, y + 1, w * 1.01, h * 1.01, shape); ctx.stroke();

  const tc = Math.round(shape.trees.length * clamp(P.trees * 1.2, 0, 1));
  for (let k = 0; k < tc; k++) {
    const tr = shape.trees[k], tx = x + tr.x * w * 0.5, ty = y - h * 0.54;
    const th = h * (0.7 + tr.h * 1.5) * (0.6 + P.trees * 0.7);
    const sway = Math.sin(t * 0.75 + tr.ph) * 1.2;
    const dark = mixHex('#16292f', '#24404d', 0.3 + tr.tone * 0.5);
    const lit = mixHex('#24404d', '#5f8a8a', 0.35 + tr.tone * 0.4);
    ctx.strokeStyle = '#16292f'; ctx.lineWidth = Math.max(1, th * 0.05);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + sway * 0.2, ty - th * 0.2); ctx.stroke();
    for (let s = 0; s < 3; s++) {
      const kk = s / 3, top = ty - th * (0.28 + kk * 0.72);
      const half = th * (0.22 - kk * 0.045), base = ty - th * (0.02 + kk * 0.4);
      ctx.beginPath(); ctx.moveTo(tx + sway * (0.3 + kk * 0.7), top);
      ctx.lineTo(tx + sway * (0.3 + kk * 0.7) - half, base);
      ctx.lineTo(tx + sway * (0.3 + kk * 0.7) + half, base);
      ctx.closePath(); ctx.fillStyle = s === 1 ? lit : dark;
      ctx.globalAlpha = fade * 0.95; ctx.fill();
    }
    ctx.globalAlpha = fade;
  }
  ctx.strokeStyle = rgba('#a8c6a0', 0.5); ctx.lineWidth = 1;
  for (let k = 0; k < 5; k++) {
    const gx = x + (k / 4 - 0.5) * w * 0.5, gy = y - h * 0.62, sway = Math.sin(t * 1.4 + k * 1.3) * 1.6;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + sway, gy - h * 0.16); ctx.stroke();
  }
}
function drawIslands(t) {
  const icons = V.icons.list;
  for (let i = 0; i < icons.length; i++) {
    const ic = icons[i];
    const fade = ic.gone ? 1 - clamp((V.icons._clock - ic.gone) / 1.6, 0, 1) : 1;
    if (fade <= 0.01) continue;
    const appear = smoothstep(0, 1, 1 - ic.fresh), cx = ic.x + ic.w / 2;
    const depthT = clamp((ic.y + ic.h + 8) / H, 0, 1);
    const baseY = horizon + 18 + depthT * (H * 0.96 - horizon - 18) + ((ic.seed % 100) - 50) * 0.5;
    const depth = clamp((baseY - horizon) / (H - horizon), 0, 1);
    const scale = (0.55 + depth * 0.8) * (ic.w / 72) * (0.8 + appear * 0.2);
    const w = ic.w * 1.55 * scale, h = w * 0.34;
    const bob = Math.sin(t * 0.6 + (ic.seed % 97)) * 1.3;
    const x = cx + Math.sin(t * 0.25 + (ic.seed % 13)) * 1.4, y = baseY + bob;
    const shape = islandFor(ic);

    ctx.save(); ctx.globalAlpha = fade * 0.20;
    ctx.translate(x, y); ctx.scale(1, -0.55);
    drawIsland(0, 0, w, h, shape, fade, t, true); ctx.restore();

    ctx.save(); ctx.globalAlpha = fade;
    drawIsland(x, y, w, h, shape, fade, t, false); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* sky, water, mist, birds */
function drawSky(t, weights) {
  const stops = [0, 1, 2].map((i) => blend3([SKY.night[i], SKY.dusk[i], SKY.day[i]], weights));
  V.bg(ctx, W, H, stops);
  const total = (weights.night + weights.dusk + weights.day) || 1;
  const nightA = weights.night / total, dayA = weights.day / total, duskA = weights.dusk / total;
  if (nightA > 0.02) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = nightA * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
      ctx.fillStyle = '#e8e2c8'; ctx.beginPath(); ctx.arc(s.x, s.y, s.rad, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const h = V.time.dayFrac * 24, sr = V.time.sunrise, ss = V.time.sunset;
  if (dayA + duskA > 0.05) {
    const prog = clamp((h - sr) / (ss - sr || 1), 0, 1);
    const sx = W * (0.12 + 0.76 * prog), sy = horizon - Math.sin(Math.PI * prog) * H * 0.36;
    const warm = duskA > dayA ? '#e8c9a0' : '#f2ecd6';
    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.3);
    glow.addColorStop(0, rgba(warm, 0.45 * (dayA + duskA)));
    glow.addColorStop(0.35, rgba(warm, 0.14 * (dayA + duskA))); glow.addColorStop(1, rgba(warm, 0));
    ctx.fillStyle = glow; ctx.fillRect(sx - H * 0.35, sy - H * 0.35, H * 0.7, H * 0.7);
    ctx.globalAlpha = dayA + duskA; ctx.fillStyle = warm;
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(10, H * 0.018), 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  }
  if (nightA > 0.04) {
    const span = (24 - ss) + sr;
    let prog = h >= ss ? (h - ss) / (span || 1) : (h + 24 - ss) / (span || 1);
    prog = clamp(prog, 0, 1);
    const mx = W * (0.12 + 0.76 * prog), my = horizon - Math.sin(Math.PI * prog) * H * 0.3;
    const r = Math.max(9, H * 0.016);
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, r * 5);
    glow.addColorStop(0, rgba('#e8e2c8', 0.22 * nightA)); glow.addColorStop(1, rgba('#e8e2c8', 0));
    ctx.fillStyle = glow; ctx.fillRect(mx - r * 6, my - r * 6, r * 12, r * 12);
    ctx.save(); ctx.globalAlpha = nightA; ctx.fillStyle = '#e8e2c8';
    ctx.beginPath(); ctx.arc(mx, my, r, 0, TAU); ctx.fill();
    const illum = (1 - Math.cos(TAU * V.time.moonPhase)) / 2, sw = r * 2 * (1 - illum);
    if (sw > 1) {
      ctx.beginPath(); ctx.ellipse(mx + (V.time.moonPhase < 0.5 ? -r + sw / 2 : r - sw / 2), my, sw / 2, r, 0, 0, TAU);
      ctx.fillStyle = '#0b1a24'; ctx.fill();
    }
    ctx.restore();
  }
  const band = ctx.createLinearGradient(0, horizon - H * 0.1, 0, horizon + H * 0.02);
  band.addColorStop(0, rgba('#e8e2c8', 0)); band.addColorStop(0.8, rgba('#e8c9a0', 0.12 * (duskA + dayA * 0.4)));
  band.addColorStop(1, rgba('#e8c9a0', 0));
  ctx.fillStyle = band; ctx.fillRect(0, horizon - H * 0.1, W, H * 0.12);
}
function drawWater(t, weights) {
  const total = (weights.night + weights.dusk + weights.day) || 1;
  const dayA = weights.day / total, duskA = weights.dusk / total;
  const top = mixHex('#24404d', '#5f8a8a', 0.22 + dayA * 0.25 + duskA * 0.2);
  const water = ctx.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, top); water.addColorStop(0.25, mixHex('#24404d', '#0b1a24', 0.25)); water.addColorStop(1, '#0b1a24');
  ctx.fillStyle = water; ctx.fillRect(0, horizon, W, H - horizon);
  if (mirror) ctx.drawImage(mirror, 0, 0, W, H);
  const glint = ctx.createLinearGradient(0, horizon, 0, horizon + H * 0.2);
  glint.addColorStop(0, rgba('#e8e2c8', 0.10 + dayA * 0.06)); glint.addColorStop(1, rgba('#e8e2c8', 0));
  ctx.fillStyle = glint; ctx.fillRect(0, horizon, W, H * 0.2);
}
function drawRipples(t) {
  const amp = P.ripples;
  if (amp <= 0.01) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, horizon, W, H - horizon); ctx.clip();
  const rows = Math.round((14 + amp * 8) * (V.reduced ? 0.6 : 1)); ctx.lineWidth = 1;
  for (let i = 0; i < rows; i++) {
    const y = horizon + 8 + (i / rows) * (H - horizon - 8), phase = t * (0.22 + amp * 0.16) + i * 0.85;
    ctx.beginPath();
    for (let x = 0; x <= W + 12; x += 12) {
      const yy = y + Math.sin(x * 0.011 + phase) * 1.3 * amp + Math.sin(x * 0.033 - phase * 0.7) * 0.55 * amp;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.strokeStyle = 'rgba(232,226,200,' + (0.022 + 0.028 * amp) * (1 - (i / rows) * 0.55) + ')';
    ctx.stroke();
  }
  ctx.restore();
}
function drawMist(t, weights, lower) {
  if (!mistTile || P.mist <= 0.01) return;
  const total = (weights.night + weights.dusk + weights.day) || 1;
  const light = 0.35 + 0.55 * (weights.day / total) + 0.25 * (weights.dusk / total);
  const bands = lower
    ? [{ y: 0.02, sc: 1.7, sp: 11, a: 0.55 }, { y: 0.09, sc: 2.3, sp: 16, a: 0.35 }]
    : [{ y: -0.015, sc: 1.3, sp: 7, a: 0.6 }];
  for (let b = 0; b < bands.length; b++) {
    const band = bands[b], tw = mistTile.width * band.sc, th = mistTile.height * band.sc;
    const off = (t * band.sp) % tw, y = horizon + H * band.y - th * 0.5;
    ctx.globalAlpha = P.mist * band.a * light;
    for (let x = -off; x < W + tw; x += tw) ctx.drawImage(mistTile, x, y, tw, th);
  }
  ctx.globalAlpha = 1;
}
function drawBirds(t) {
  if (!P.birds) return;
  if (!flock.active) {
    if (t > flock.next) {
      flock.active = true; flock.t0 = t; flock.dir = Math.random() < 0.5 ? -1 : 1;
      flock.y = horizon - H * (0.1 + Math.random() * 0.2); flock.seed = Math.random() * 100;
    }
    return;
  }
  const dur = 18, age = t - flock.t0;
  if (age > dur) { flock.active = false; flock.next = t + 22 + Math.random() * 26; return; }
  const prog = age / dur, fade = smoothstep(0, 0.1, prog) * (1 - smoothstep(0.9, 1, prog));
  const span = W + 160, x0 = flock.dir > 0 ? -80 + prog * span : W + 80 - prog * span;
  const y0 = flock.y + Math.sin(prog * TAU * 1.1 + flock.seed) * H * 0.02;
  const s = clamp(H / 1080, 0.7, 1.5) * 1.1;
  ctx.save(); ctx.globalAlpha = fade * 0.6; ctx.strokeStyle = '#16292f';
  ctx.lineWidth = 1.6 * s; ctx.lineCap = 'round';
  for (let k = 0; k < 5; k++) {
    const bx = x0 + (k - 2) * 22 * s + Math.sin(t * 0.6 + k) * 4;
    const by = y0 + Math.abs(k - 2) * 8 * s + Math.sin(t * 1.1 + k * 2) * 3;
    const flap = Math.sin(t * 7 + k * 1.3 + flock.seed) * 3.4 * s;
    ctx.beginPath(); ctx.moveTo(bx - 7 * s, by + flap);
    ctx.quadraticCurveTo(bx - 3 * s, by - 3 * s, bx, by);
    ctx.quadraticCurveTo(bx + 3 * s, by - 3 * s, bx + 7 * s, by + flap); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* layout + frame */
function rebuild() {
  W = view.w; H = view.h; horizon = H * 0.38;
  buildMountains(); buildStars(); if (!mistTile) makeMistTile();
  islandCache.clear(); flock.active = false;
}
view.onResize(rebuild); rebuild();

V.loop((dt, t) => {
  const weights = skyWeights();
  drawSky(t, weights);
  if (mountains) ctx.drawImage(mountains, 0, 0, W, H);
  drawMist(t, weights, false);
  drawWater(t, weights);
  drawRipples(t);
  drawIslands(t);
  drawMist(t, weights, true);
  drawBirds(t);

  const total = (weights.night + weights.dusk + weights.day) || 1;
  const nightA = weights.night / total, duskA = weights.dusk / total;
  if (nightA > 0.02) { ctx.fillStyle = 'rgba(8,20,28,' + nightA * 0.32 + ')'; ctx.fillRect(0, 0, W, H); }
  if (duskA > 0.02) { ctx.fillStyle = 'rgba(195,174,142,' + duskA * 0.05 + ')'; ctx.fillRect(0, 0, W, H); }
  V.vignette(ctx, W, H, 0.46); V.grain(ctx, W, H, 0.05);
});
</script>
</body>
</html>
