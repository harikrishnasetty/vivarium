<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moss Vale — Vivarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #071a18; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import {
  Vivarium, TAU, clamp, lerp, smoothstep, makeNoise2D, fbm,
  mulberry32, hexToRgb, mixHex, rgba,
} from '../_runtime/engine.js';

const V = await Vivarium.ready;
const view = V.canvas('stage');
const ctx = view.ctx;

/* ------------------------------------------------------------------ */
/* Parameters                                                         */
/* ------------------------------------------------------------------ */
const DEFAULTS = { fireflies: 80, mist: 0.6, sky: 'auto', deer: true, sway: 1 };
let P = Object.assign({}, DEFAULTS, V.params);
V.on('params', (p) => {
  const prev = P;
  P = Object.assign({}, P, p);
  if (prev.fireflies !== P.fireflies) buildFireflies();
});

/* ------------------------------------------------------------------ */
/* Seeded data                                                        */
/* ------------------------------------------------------------------ */
const hillNoise = makeNoise2D(1201);
const mistNoise = makeNoise2D(2207);
const fireNoise = makeNoise2D(3301);

let W = 0;
let H = 0;
let stars = [];
let trees = [];
let flies = [];
let deerState = { active: false, next: 14, t0: 0, dir: 1 };
let deerSeed = 777;

const SKY = {
  night: ['#04100f', '#0a2320', '#123b33'],
  dusk: ['#241733', '#5c2a45', '#c96a4e'],
  day: ['#8fc7b6', '#c9e5cd', '#eef3d5'],
};

const LAYERS = [
  { base: 0.60, amp: 0.070, freq: 1.5, drift: 0.0035, mix: 0.52, trees: 0, treeH: 0 },
  { base: 0.695, amp: 0.085, freq: 2.0, drift: 0.006, mix: 0.34, trees: 20, treeH: 26 },
  { base: 0.795, amp: 0.075, freq: 2.7, drift: 0.010, mix: 0.18, trees: 28, treeH: 34 },
  { base: 0.905, amp: 0.048, freq: 3.4, drift: 0.016, mix: 0.06, trees: 30, treeH: 44 },
];

function toHex(r, g, b) {
  const n = ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)) >>> 0;
  return '#' + n.toString(16).slice(1);
}

function blend3(cols, w) {
  const t = (w.night + w.dusk + w.day) || 1;
  const a = hexToRgb(cols[0]);
  const b = hexToRgb(cols[1]);
  const c = hexToRgb(cols[2]);
  return toHex(
    (a.r * w.night + b.r * w.dusk + c.r * w.day) / t,
    (a.g * w.night + b.g * w.dusk + c.g * w.day) / t,
    (a.b * w.night + b.b * w.dusk + c.b * w.day) / t
  );
}

function skyWeights() {
  const h = V.time.dayFrac * 24;
  const sr = V.time.sunrise;
  const ss = V.time.sunset;
  if (P.sky === 'day') return { day: 1, dusk: 0, night: 0 };
  if (P.sky === 'night') return { day: 0, dusk: 0, night: 1 };
  if (P.sky === 'dusk') return { day: 0.08, dusk: 0.82, night: 0.30 };
  const day = smoothstep(sr - 0.5, sr + 0.9, h) * (1 - smoothstep(ss - 0.9, ss + 0.5, h));
  const duskRaw = clamp(1 - Math.abs(h - sr) / 1.6, 0, 1) + clamp(1 - Math.abs(h - ss) / 1.6, 0, 1);
  const dusk = clamp(duskRaw, 0, 1) * (1 - day * 0.55);
  return { day, dusk, night: clamp(1 - day - dusk, 0, 1) };
}

/* ------------------------------------------------------------------ */
/* Pre-rendered sprites                                               */
/* ------------------------------------------------------------------ */
function makeGlowSprite(color) {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  const rgb = hexToRgb(color);
  grad.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',1)');
  grad.addColorStop(0.25, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.55)');
  grad.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return c;
}

const glowWarm = makeGlowSprite('#ffe9a3');
const glowLime = makeGlowSprite('#d7ff9e');
const glowTeal = makeGlowSprite('#9effe0');

let mistTile = null;
function makeMistTile() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 160;
  const g = c.getContext('2d');
  const r = mulberry32(8181);
  for (let i = 0; i < 26; i++) {
    const x = r() * 512;
    const y = 36 + r() * 96;
    const rad = 38 + r() * 92;
    const grad = g.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, 'rgba(226,244,232,0.20)');
    grad.addColorStop(1, 'rgba(226,244,232,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(x, y, rad, 0, TAU);
    g.fill();
  }
  mistTile = c;
}

/* ------------------------------------------------------------------ */
/* Layout (rebuilt on resize)                                         */
/* ------------------------------------------------------------------ */
function hillY(x, layer, t) {
  const L = LAYERS[layer];
  const drift = t * L.drift;
  const n = fbm(hillNoise, x * 0.0016 * L.freq + drift, layer * 7.3 + drift * 2, 3);
  return H * L.base - n * H * L.amp;
}

function buildStars() {
  const r = mulberry32(991);
  stars = [];
  const n = Math.round((W * H) / 16000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: r() * W,
      y: r() * H * 0.55,
      rad: 0.4 + r() * 1.3,
      ph: r() * TAU,
      sp: 0.6 + r() * 1.8,
    });
  }
}

function buildTrees() {
  trees = [];
  for (let li = 0; li < LAYERS.length; li++) {
    const L = LAYERS[li];
    if (!L.trees) continue;
    const r = mulberry32(6001 + li * 97);
    for (let i = 0; i < L.trees; i++) {
      trees.push({
        layer: li,
        x: (i + 0.2 + r() * 0.7) * (W / L.trees),
        h: L.treeH * (0.55 + r() * 0.9),
        sway: r() * TAU,
      });
    }
  }
}

function buildFireflies() {
  const n = Math.round(P.fireflies * (V.reduced ? 0.45 : 1));
  const r = mulberry32(5000 + n * 13);
  flies = [];
  for (let i = 0; i < n; i++) {
    flies.push({
      x: r() * W,
      y: H * (0.5 + r() * 0.45),
      vx: 0,
      vy: 0,
      ph: r() * TAU,
      sp: 0.35 + r() * 0.8,
      size: 1.4 + r() * 2.4,
      sprite: r() < 0.62 ? glowWarm : r() < 0.8 ? glowLime : glowTeal,
      target: null,
      retarget: 0,
    });
  }
}

function rebuild() {
  W = view.w;
  H = view.h;
  buildStars();
  buildTrees();
  buildFireflies();
  deerState.active = false;
}

view.onResize(rebuild);
makeMistTile();
rebuild();

/* ------------------------------------------------------------------ */
/* Drawing                                                            */
/* ------------------------------------------------------------------ */
function drawSky(w, t) {
  const weights = skyWeights();
  const stops = [0, 1, 2].map((i) => blend3([SKY.night[i], SKY.dusk[i], SKY.day[i]], weights));
  V.bg(ctx, W, H, stops);

  const horizon = H * 0.62;

  /* stars */
  const starA = weights.night / ((weights.night + weights.dusk + weights.day) || 1);
  if (starA > 0.02) {
    ctx.save();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = starA * tw * 0.9;
      ctx.fillStyle = '#dff5ea';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.rad, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  const h = V.time.dayFrac * 24;
  const sr = V.time.sunrise;
  const ss = V.time.sunset;

  /* sun */
  const dayA = weights.day / ((weights.night + weights.dusk + weights.day) || 1);
  if (dayA > 0.03) {
    const prog = clamp((h - sr) / (ss - sr || 1), 0, 1);
    const sx = W * (0.1 + 0.8 * prog);
    const sy = horizon - Math.sin(Math.PI * prog) * H * 0.42;
    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.36);
    glow.addColorStop(0, rgba('#fff3c4', 0.55 * dayA));
    glow.addColorStop(0.4, rgba('#ffd98a', 0.16 * dayA));
    glow.addColorStop(1, 'rgba(255,217,138,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - H * 0.4, sy - H * 0.4, H * 0.8, H * 0.8);
    ctx.globalAlpha = dayA;
    ctx.fillStyle = '#fff4c9';
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(14, H * 0.022), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* moon */
  const nightA = weights.night / ((weights.night + weights.dusk + weights.day) || 1);
  if (nightA > 0.03) {
    const span = (24 - ss) + sr;
    let prog = h >= ss ? (h - ss) / (span || 1) : (h + 24 - ss) / (span || 1);
    prog = clamp(prog, 0, 1);
    const mx = W * (0.1 + 0.8 * prog);
    const my = horizon - Math.sin(Math.PI * prog) * H * 0.36;
    const r = Math.max(12, H * 0.02);
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, r * 6);
    glow.addColorStop(0, rgba('#d8f0e6', 0.28 * nightA));
    glow.addColorStop(1, 'rgba(216,240,230,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(mx - r * 7, my - r * 7, r * 14, r * 14);

    ctx.save();
    ctx.globalAlpha = nightA;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.fillStyle = '#e9f2e6';
    ctx.fill();
    const illum = (1 - Math.cos(TAU * V.time.moonPhase)) / 2;
    const shadowW = r * 2 * (1 - illum);
    if (shadowW > 1) {
      ctx.beginPath();
      const offset = V.time.moonPhase < 0.5 ? -r + shadowW / 2 : r - shadowW / 2;
      ctx.ellipse(mx + offset, my, shadowW / 2, r, 0, 0, TAU);
      ctx.fillStyle = 'rgba(5,16,14,0.88)';
      ctx.fill();
    }
    ctx.restore();
  }

  /* warm horizon band at dusk */
  const duskA = weights.dusk / ((weights.night + weights.dusk + weights.day) || 1);
  if (duskA > 0.03) {
    const g = ctx.createLinearGradient(0, horizon - H * 0.22, 0, horizon + H * 0.05);
    g.addColorStop(0, 'rgba(255,170,110,0)');
    g.addColorStop(0.7, 'rgba(255,170,110,' + 0.16 * duskA + ')');
    g.addColorStop(1, 'rgba(255,140,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizon - H * 0.22, W, H * 0.27);
  }

  return { weights, horizon };
}

function drawHills(w, t, weights, horizon) {
  const horizonHex = blend3([SKY.night[2], SKY.dusk[2], SKY.day[2]], weights);
  for (let li = 0; li < LAYERS.length; li++) {
    const L = LAYERS[li];
    const color = mixHex('#0a1b16', horizonHex, L.mix);
    ctx.beginPath();
    ctx.moveTo(0, H);
    const step = Math.max(8, W / 120);
    for (let x = 0; x <= W + step; x += step) {
      ctx.lineTo(x, hillY(x, li, t));
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    /* ridge highlight, very subtle */
    if (li >= 2) {
      ctx.strokeStyle = 'rgba(210,240,220,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  return horizonHex;
}

function drawTrees(w, t) {
  for (let i = 0; i < trees.length; i++) {
    const tr = trees[i];
    const L = LAYERS[tr.layer];
    const y = hillY(tr.x, tr.layer, t);
    const sway = Math.sin(t * 0.8 + tr.sway) * P.sway * 1.6;
    const h = tr.h;
    const color = mixHex('#081712', '#16352a', 0.35 + tr.layer * 0.12);
    ctx.fillStyle = color;
    /* three stacked pine triangles */
    for (let k = 0; k < 3; k++) {
      const kk = k / 3;
      const topY = y - h * (0.45 + kk * 0.75);
      const halfW = h * (0.30 - kk * 0.06);
      const baseY = y - h * (0.05 + kk * 0.42);
      const off = sway * (1 - kk * 0.4);
      ctx.beginPath();
      ctx.moveTo(tr.x + off, topY);
      ctx.lineTo(tr.x + off - halfW, baseY);
      ctx.lineTo(tr.x + off + halfW, baseY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(tr.x - 0.9 + sway * 0.2, y - h * 0.22, 1.8, h * 0.24);
  }
}

function drawMist(w, t, weights) {
  if (!mistTile || P.mist <= 0.01) return;
  const dayA = weights.day / ((weights.night + weights.dusk + weights.day) || 1);
  const baseA = P.mist * (0.35 + 0.5 * dayA);
  const bands = [
    { y: 0.60, scale: 1.0, speed: 5, alpha: 0.85 },
    { y: 0.68, scale: 1.5, speed: 9, alpha: 0.65 },
    { y: 0.78, scale: 2.1, speed: 14, alpha: 0.5 },
  ];
  for (let b = 0; b < bands.length; b++) {
    const band = bands[b];
    const tw = mistTile.width * band.scale;
    const th = mistTile.height * band.scale;
    const off = (t * band.speed) % tw;
    ctx.globalAlpha = baseA * band.alpha;
    const y = H * band.y - th * 0.5;
    for (let x = -off; x < W + tw; x += tw) {
      ctx.drawImage(mistTile, x, y, tw, th);
    }
  }
  ctx.globalAlpha = 1;
}

function drawIconShadows(w, t) {
  const icons = V.icons.list;
  for (let i = 0; i < icons.length; i++) {
    const ic = icons[i];
    const fade = 1 - clamp((ic.gone ? (V.icons._clock - ic.gone) / 1.6 : 0), 0, 1);
    if (fade <= 0) continue;
    const cx = ic.x + ic.w / 2;
    const cy = ic.y + ic.h - 4;
    const rx = ic.w * 0.72;
    const ry = Math.max(6, ic.w * 0.16);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, 'rgba(3,10,8,' + 0.34 * fade + ')');
    g.addColorStop(0.6, 'rgba(3,10,8,' + 0.16 * fade + ')');
    g.addColorStop(1, 'rgba(3,10,8,0)');
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    ctx.translate(-cx, -cy);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, rx, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawFireflies(w, t, weights) {
  if (!flies.length) return;
  const nightA = 0.35 + 0.65 * (weights.night / ((weights.night + weights.dusk + weights.day) || 1));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const icons = V.icons.list;
  for (let i = 0; i < flies.length; i++) {
    const f = flies[i];
    const nx = fireNoise(f.x * 0.0018, f.y * 0.0018 + t * 0.06);
    const ny = fireNoise(f.x * 0.0018 + 51.7, f.y * 0.0018 + t * 0.06 + 19.3);
    f.vx += nx * 26 * f.sp * (V.reduced ? 0.4 : 1);
    f.vy += ny * 22 * f.sp * (V.reduced ? 0.4 : 1);

    if (t > f.retarget) {
      f.target = V.icons.nearest(f.x, f.y, 520);
      f.retarget = t + 2.5 + Math.random() * 5;
    }
    if (f.target && f.target.gone === 0) {
      const ic = f.target;
      const cx = ic.x + ic.w / 2;
      const cy = ic.y + ic.h / 2;
      const dx = cx - f.x;
      const dy = cy - f.y;
      const dist = Math.hypot(dx, dy) || 1;
      const orbit = ic.w * 0.78 + 26;
      if (dist > orbit) {
        f.vx += (dx / dist) * 16;
        f.vy += (dy / dist) * 16;
      } else {
        f.vx += (-dy / dist) * 9;
        f.vy += (dx / dist) * 9;
        f.vx += (dx / dist) * (dist - orbit) * 0.3;
        f.vy += (dy / dist) * (dist - orbit) * 0.3;
      }
    }

    f.vx *= 0.985;
    f.vy *= 0.985;
    const speed = Math.hypot(f.vx, f.vy);
    if (speed > 42) {
      f.vx = (f.vx / speed) * 42;
      f.vy = (f.vy / speed) * 42;
    }
    f.x += f.vx * (1 / 30);
    f.y += f.vy * (1 / 30);

    if (f.x < -20) f.x = W + 20;
    if (f.x > W + 20) f.x = -20;
    if (f.y < H * 0.3) f.y = H * 0.3;
    if (f.y > H - 10) f.y = H - 10;

    const pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.1 + f.ph));
    const alpha = pulse * nightA;
    const size = f.size * 8 * (0.8 + pulse * 0.5);
    ctx.globalAlpha = alpha;
    ctx.drawImage(f.sprite, f.x - size / 2, f.y - size / 2, size, size);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawDeer(w, t) {
  if (!P.deer) return;
  if (!deerState.active) {
    if (t > deerState.next) {
      deerState.active = true;
      deerState.t0 = t;
      deerState.dir = Math.random() < 0.5 ? -1 : 1;
      deerSeed = (Math.random() * 1e9) | 0;
    }
    return;
  }
  const dur = 16;
  const age = t - deerState.t0;
  if (age > dur) {
    deerState.active = false;
    deerState.next = t + 26 + Math.random() * 30;
    return;
  }
  const prog = age / dur;
  const fade = smoothstep(0, 0.12, prog) * (1 - smoothstep(0.86, 1, prog));
  const layer = 2;
  const baseY = hillY(W * 0.5, layer, t) + 2;
  const span = W + 220;
  const x = deerState.dir > 0 ? -110 + prog * span : W + 110 - prog * span;
  const y = baseY - 2;
  const s = clamp(H / 1080, 0.6, 1.6) * 1.1;
  const walk = Math.sin(t * 5.2) * 0.35;

  ctx.save();
  ctx.globalAlpha = fade * 0.9;
  ctx.fillStyle = '#05100c';
  ctx.translate(x, y);
  ctx.scale(deerState.dir * s, s);

  /* body */
  ctx.beginPath();
  ctx.ellipse(0, -22, 27, 12.5, -0.06, 0, TAU);
  ctx.fill();
  /* neck + head */
  ctx.beginPath();
  ctx.ellipse(22, -38, 7, 15, -0.5, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(30, -48, 8, 5.5, -0.25, 0, TAU);
  ctx.fill();
  /* ears */
  ctx.beginPath();
  ctx.ellipse(25, -53, 3.4, 6.5, -0.55, 0, TAU);
  ctx.fill();
  /* antlers */
  ctx.strokeStyle = '#05100c';
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(29, -51);
  ctx.lineTo(34, -62);
  ctx.moveTo(31, -56);
  ctx.lineTo(37, -57);
  ctx.moveTo(33, -59);
  ctx.lineTo(30, -65);
  ctx.stroke();
  /* legs */
  ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const lx = -16 + i * 11;
    const swing = Math.sin(t * 5.2 + i * 1.7) * 3.4 * walk;
    ctx.beginPath();
    ctx.moveTo(lx, -14);
    ctx.lineTo(lx + swing, 2);
    ctx.stroke();
  }
  /* tail */
  ctx.beginPath();
  ctx.ellipse(-27, -27, 4.5, 3.2, 0.5, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------ */
/* Frame                                                              */
/* ------------------------------------------------------------------ */
V.loop((dt, t) => {
  const sky = drawSky(W, t);
  drawHills(W, t, sky.weights, sky.horizon);
  drawMist(W, t, sky.weights);
  drawTrees(W, t);
  drawIconShadows(W, t);
  drawFireflies(W, t, sky.weights);
  drawDeer(W, t);
  V.vignette(ctx, W, H, 0.45);
  V.grain(ctx, W, H, 0.045);
});
</script>
</body>
</html>
