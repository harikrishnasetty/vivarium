<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp — Vivarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0304; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import {
  Vivarium, TAU, clamp, makeNoise2D, fbm, mulberry32, hexToRgb, rgba,
} from '../_runtime/engine.js';

const V = await Vivarium.ready;
const view = V.canvas('stage');
const ctx = view.ctx;

/* ------------------------------------------------------------------ */
/* Parameters                                                         */
/* ------------------------------------------------------------------ */
const DEFAULTS = { blobs: 7, speed: 0.6, grain: 0.5, palette: 'magma', glow: 0.7 };
let P = Object.assign({}, DEFAULTS, V.params);
V.on('params', (p) => {
  const prev = P;
  P = Object.assign({}, P, p);
  if (prev.blobs !== P.blobs) buildBlobs();
  if (prev.palette !== P.palette) {
    buildSprites();
    buildBackground();
  }
});

/* ------------------------------------------------------------------ */
/* Palettes                                                           */
/* ------------------------------------------------------------------ */
const PAL = {
  magma: { bg: ['#0d0304', '#230809', '#3a100c'], cols: ['#ff5a2e', '#ff9b45', '#ffd48a', '#c72f5f', '#7a1f4a'] },
  tide: { bg: ['#02080f', '#04141f', '#072430'], cols: ['#1f7a8c', '#2fb8b0', '#8ff0d8', '#3f6fd0', '#7fd8ff'] },
  sunset: { bg: ['#120612', '#25101f', '#3a1526'], cols: ['#ff6f61', '#ffa45c', '#ffd9a0', '#d0508a', '#7d4fb0'] },
};

const warp = makeNoise2D(5501);

let W = 0;
let H = 0;
let blobs = [];
let bgLayer = null;
let sprites = [];

function pal() {
  return PAL[P.palette] || PAL.magma;
}

function makeBlobSprite(color) {
  const S = 192;
  const c = document.createElement('canvas');
  c.width = S;
  c.height = S;
  const g = c.getContext('2d');
  const rgb = hexToRgb(color);
  const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grad.addColorStop(0, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.95)');
  grad.addColorStop(0.22, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.62)');
  grad.addColorStop(0.55, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.24)');
  grad.addColorStop(0.82, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.07)');
  grad.addColorStop(1, 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  return c;
}

function buildSprites() {
  sprites = pal().cols.map((c) => makeBlobSprite(c));
}

function buildBackground() {
  if (!W || !H) return;
  const p = pal();
  bgLayer = document.createElement('canvas');
  bgLayer.width = W;
  bgLayer.height = H;
  const g = bgLayer.getContext('2d');
  V.bg(g, W, H, p.bg);
  const m = Math.max(W, H);
  const glow = g.createRadialGradient(W * 0.5, H * 0.62, 0, W * 0.5, H * 0.62, m * 0.75);
  glow.addColorStop(0, 'rgba(255,190,150,0.05)');
  glow.addColorStop(1, 'rgba(0,0,0,0.4)');
  g.fillStyle = glow;
  g.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------------ */
/* Blobs                                                              */
/* ------------------------------------------------------------------ */
function buildBlobs() {
  if (!W || !H) return;
  const count = Math.round(P.blobs);
  const r = mulberry32(6007 + count * 13);
  blobs = [];
  for (let i = 0; i < count; i++) {
    blobs.push({
      bx: (0.16 + r() * 0.68) * W,
      by: (0.16 + r() * 0.72) * H,
      r: Math.min(W, H) * (0.1 + r() * 0.14),
      ph: r() * TAU,
      sp: 0.5 + r() * 1.2,
      ci: i % 5,
      nx: r() * 20,
      ny: r() * 20,
      sq: 0.78 + r() * 0.4,
      rot: r() * TAU,
    });
  }
}

function rebuild() {
  W = view.w;
  H = view.h;
  buildSprites();
  buildBackground();
  buildBlobs();
}

view.onResize(rebuild);
rebuild();

/* ------------------------------------------------------------------ */
/* Frame                                                              */
/* ------------------------------------------------------------------ */
V.loop((dt, t) => {
  if (!bgLayer) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(bgLayer, 0, 0, W, H);

  const ms = (0.3 + P.speed) * (V.reduced ? 0.6 : 1);
  const m = Math.min(W, H);

  /* ---- molten blobs ------------------------------------------------ */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const count = V.reduced ? Math.ceil(blobs.length * 0.75) : blobs.length;
  for (let i = 0; i < count; i++) {
    const b = blobs[i];
    const dx = fbm(warp, b.nx + t * 0.012 * ms, b.ny, 2) * W * 0.15;
    const dy = fbm(warp, b.nx + 31.7, b.ny + t * 0.014 * ms, 2) * H * 0.13;
    const x = b.bx + dx + Math.sin(t * 0.07 * b.sp * ms + b.ph) * W * 0.035;
    const y = b.by + dy + Math.cos(t * 0.055 * b.sp * ms + b.ph * 1.3) * H * 0.035;
    const rad = b.r * (1 + Math.sin(t * 0.22 * b.sp * ms + b.ph) * 0.13);

    const cu = (b.ci + t * 0.032 * ms) % sprites.length;
    const i0 = Math.floor(cu);
    const i1 = (i0 + 1) % sprites.length;
    const fr = cu - i0;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.rot + t * 0.02 * b.sp * ms);
    ctx.scale(1, b.sq);

    const pulse = 0.62 + 0.3 * Math.sin(t * 0.3 * b.sp * ms + b.ph);
    const a = pulse * (0.34 + 0.55 * P.glow);

    ctx.globalAlpha = a * (1 - fr);
    ctx.drawImage(sprites[i0], -rad, -rad, rad * 2, rad * 2);
    ctx.globalAlpha = a * fr;
    ctx.drawImage(sprites[i1], -rad, -rad, rad * 2, rad * 2);

    /* hot inner core */
    ctx.globalAlpha = a * 0.55;
    ctx.drawImage(sprites[i0], -rad * 0.48, -rad * 0.48, rad * 0.96, rad * 0.96);
    ctx.restore();
  }
  ctx.restore();

  /* ---- icon halos: light passes behind the tiles ------------------- */
  const icons = V.icons.list;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < icons.length; i++) {
    const ic = icons[i];
    const fade = ic.gone ? 1 - clamp((V.icons._clock - ic.gone) / 1.6, 0, 1) : 1;
    if (fade <= 0) continue;
    const cx = ic.x + ic.w * 0.5;
    const cy = ic.y + ic.h * 0.5;
    const sprite = sprites[(ic.seed + 2) % sprites.length];
    const hs = ic.w * 2.6;
    const pulse = 0.55 + 0.45 * Math.sin(t * 0.7 + (ic.seed % 100) * 0.1);
    ctx.globalAlpha = (0.1 + 0.16 * P.glow) * fade * (0.65 + 0.35 * pulse);
    ctx.drawImage(sprite, cx - hs / 2, cy - hs / 2, hs, hs);
  }
  ctx.restore();

  /* ---- faint caustics under each icon ------------------------------ */
  const cols = pal().cols;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  for (let i = 0; i < icons.length; i++) {
    const ic = icons[i];
    const fade = ic.gone ? 1 - clamp((V.icons._clock - ic.gone) / 1.6, 0, 1) : 1;
    if (fade <= 0) continue;
    const cx = ic.x + ic.w * 0.5;
    const y0 = ic.y + ic.h + 4;
    ctx.strokeStyle = rgba(cols[2], 0.5);
    ctx.globalAlpha = 0.16 * fade * (0.4 + P.glow * 0.8);
    for (let q = 0; q < 3; q++) {
      const half = ic.w * (0.5 - q * 0.06);
      const yy = y0 + q * 4 + Math.sin(t * 1.1 + q) * 1.2;
      ctx.beginPath();
      for (let x = cx - half; x <= cx + half + 0.01; x += 5) {
        const wob = Math.sin(x * 0.085 + t * 1.4 + q * 1.9 + (ic.seed % 13)) * (2.2 - q * 0.4);
        if (x === cx - half) ctx.moveTo(x, yy + wob);
        else ctx.lineTo(x, yy + wob);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  V.vignette(ctx, W, H, 0.6);
  V.grain(ctx, W, H, 0.018 + P.grain * 0.075);
});
</script>
</body>
</html>
